<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dora</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050912;--panel:rgba(16,26,46,.55);--line:rgba(110,210,255,.16);--cy:#43e0ff;--bl:#4a7dff;--vi:#9b6bff;--tx:#e6f7ff;--mut:#84a8bd;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.blob{position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none}
.b1{background:var(--bl);top:-20vmax;left:-15vmax;animation:drift 22s ease-in-out infinite alternate}
.b2{background:var(--vi);bottom:-25vmax;right:-15vmax;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);align-items:start}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:26px;letter-spacing:.28em;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx);border:1px solid var(--line);padding:7px 14px;border-radius:99px;background:var(--panel);backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
body[data-s=listening] .dot{background:#5dffa8;box-shadow:0 0 10px #5dffa8}body[data-s=thinking] .dot{background:#ffd25d;box-shadow:0 0 10px #ffd25d}body[data-s=speaking] .dot{background:var(--vi);box-shadow:0 0 10px var(--vi)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.stage{position:relative;width:min(100%,440px);aspect-ratio:1;margin:4px auto}
.stage>*{position:absolute}
canvas{inset:0;width:100%;height:100%}
.ring{border-radius:50%}
.r1{inset:19%;background:conic-gradient(from 0deg,transparent,var(--cy),transparent 40%,var(--vi),transparent 80%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 8s linear infinite}
.r2{inset:5%;border:1px dashed rgba(67,224,255,.3);animation:spin 40s linear infinite reverse}
.r3{inset:0;border:1px solid rgba(155,107,255,.22)}
.glow{inset:20%;border-radius:50%;box-shadow:0 0 60px 10px rgba(67,224,255,.25),0 0 90px 20px rgba(155,107,255,.12);animation:pulse 3s ease-in-out infinite}
#avatar{inset:22%;width:56%;height:56%;border-radius:50%;object-fit:cover;object-position:56% 30%;border:2px solid rgba(67,224,255,.75)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.5}}
body[data-s=listening] .r1{animation-duration:4s}body[data-s=thinking] .r1{animation-duration:1.1s}body[data-s=speaking] .glow{animation-duration:.8s}
.ctl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
#mic{width:68px;height:68px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--cy),var(--vi));color:#04101c;display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 8px 30px rgba(67,224,255,.35)}
#mic:hover{transform:scale(1.05)}
body[data-s=listening] #mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #5dffa8;animation:ping 1.2s ease-out infinite}
@keyframes ping{to{transform:scale(1.35);opacity:0}}
#cap{min-height:20px;font-size:13px;color:var(--mut);text-align:center;padding:0 8px}
#log{height:min(52vh,380px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding-right:4px}
.m{padding:10px 14px;border-radius:16px;max-width:88%;line-height:1.45;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:linear-gradient(135deg,rgba(74,125,255,.55),rgba(155,107,255,.45));border-bottom-right-radius:4px}
.a{background:rgba(67,224,255,.1);border:1px solid var(--line);border-bottom-left-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--mut);background:none;text-align:center}
.err{border-color:rgba(255,120,120,.5);color:#ffb4b4}
.typing:empty::after{content:"•••";letter-spacing:3px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px 14px;font:inherit;outline:none}
input[type=text]:focus{border-color:var(--cy)}
button{font:inherit;color:var(--tx);background:rgba(67,224,255,.08);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;font-size:13px}
button:hover{background:rgba(67,224,255,.2);border-color:var(--cy)}
#send{background:linear-gradient(135deg,var(--bl),var(--vi));border:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.col{display:grid;gap:18px;min-width:0}
details summary{cursor:pointer;font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.set{display:grid;gap:12px;margin-top:14px;font-size:13px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px}
select{background:rgba(0,0,0,.4);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit}
.note{font-size:11.5px;color:var(--mut);line-height:1.5}
input[type=text]{font-size:16px}
@media(max-width:600px){.wrap{padding:12px;gap:14px}.brand{font-size:22px}.card{padding:14px;border-radius:18px}.stage{width:min(100%,300px)}#log{height:40vh}#mic{width:76px;height:76px}button{padding:11px 14px}.m{font-size:15px}}
@media(display-mode:standalone){body{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}}
</style>
</head>
<body data-s="idle">
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
<header><span class="brand">DORA</span><span style="display:flex;gap:10px;align-items:center"><button id="inst" hidden>Install app</button><span class="pill"><span class="dot"></span><span id="status">Idle</span></span></span></header>

<section class="card">
<div class="stage">
<canvas id="cv"></canvas>
<div class="ring r3"></div><div class="ring r2"></div><div class="glow"></div><div class="ring r1"></div>
<img id="avatar" alt="Dora avatar" src="avatar.png">
</div>
<div class="ctl">
<button id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<div id="cap">Tap the mic and speak, or type below.</div>
</div>
</section>

<div class="col">
<section class="card">
<div id="log"></div>
<div class="row"><input type="text" id="in" placeholder="Ask Dora anything…" autocomplete="off"><button id="send">➤</button></div>
<div class="chips" id="chips"><button>What's today's date and time?</button><button>Tell me a short story</button><button>Draft a professional email</button><button>How are you, Dora?</button></div>
</section>
<section class="card">
<details>
<summary>SETTINGS</summary>
<div class="set">
<label>Voice language<select id="lang"><option value="hi-IN">Hindi / Hinglish</option><option value="en-IN">English (India)</option><option value="en-US">English (US)</option></select></label>
<label>Spoken replies<input type="checkbox" id="vo" checked></label>
<label>Wake word "Hey Dora"<input type="checkbox" id="wk"></label>
<label>Voice<select id="vsel" style="max-width:62%"></select></label>
<div class="row"><button id="vtest">Test voice</button></div>
<div class="row" style="flex-wrap:wrap"><button id="rep">Replace image</button><button id="rem">Remove image</button><button id="rst">Restore original</button><button id="clr">Clear chat</button></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="note">Voice uses the browser Web Speech API (best in Chrome or Edge). The wake word only works while this tab is open, because browsers do not allow background listening. Dora cannot set reminders, search the web or check live weather yet.</div>
</div>
</details>
</section>
</div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},body=document.body,img=$('avatar'),orig=img.src,st='idle',busy=false,hist=[],sample=null,rec=null,recOn=false;
var names={idle:'Idle',listening:'Listening',thinking:'Thinking',speaking:'Speaking'};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,log=$('log'),cap=$('cap'),inp=$('in');
function setS(s){st=s;body.dataset.s=s;$('status').textContent=names[s]}
function scroll(){log.scrollTop=log.scrollHeight}
function add(c,t){var d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);scroll();return d}
function save(){try{localStorage.setItem('dora_h',JSON.stringify(hist.slice(-30)))}catch(e){}}
try{hist=JSON.parse(localStorage.getItem('dora_h')||'[]')}catch(e){hist=[]}
if(!Array.isArray(hist))hist=[];
if(hist.length)hist.forEach(function(h){add(h.r==='u'?'u':'a',h.t)});else add('sys','Hi, I\'m Dora. Tap the mic to talk, or type a message.');
if(!SR){$('mic').style.display='none';cap.textContent='Voice input isn\'t supported in this browser. Please type instead.';$('wk').disabled=true}

var spTok=0,voices=[],chosen='';
try{chosen=localStorage.getItem('dora_v')||''}catch(e){}
function vscore(v){var n=v.name.toLowerCase(),k=0;if(/natural|neural|online/.test(n))k+=6;if(/google|microsoft|siri|premium|enhanced/.test(n))k+=3;if(/neerja|swara|heera|kalpana|lekha|veena|aditi|priya|raveena|zira|jenny|aria|samantha|karen/.test(n))k+=2;if(!v.localService)k+=1;return k}
function vl(v){return v.lang.replace('_','-')}
function loadVoices(){if(!window.speechSynthesis)return;voices=speechSynthesis.getVoices();var sel=$('vsel'),cur=chosen;
 sel.innerHTML='<option value="">Auto (best natural voice)</option>';
 voices.filter(function(v){return /^(hi|en)/.test(vl(v))}).sort(function(a,b){return vscore(b)-vscore(a)}).forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+vl(v)+')';sel.appendChild(o)});
 sel.value=cur;if(sel.value!==cur)sel.value=''}
function pickVoice(lang){if(chosen){var m=voices.filter(function(v){return v.name===chosen})[0];if(m)return m}
 var p=lang.slice(0,2),c=voices.filter(function(v){return vl(v).slice(0,2)===p}),ex=c.filter(function(v){return vl(v)===lang}),pool=(ex.length?ex:c).slice();
 pool.sort(function(a,b){return vscore(b)-vscore(a)});return pool[0]||null}
function speak(t){
 var ss=window.speechSynthesis;
 if(!$('vo').checked||!ss){done();return}
 ss.cancel();var tok=++spTok,dev=/[\u0900-\u097F]/.test(t),lang=dev?'hi-IN':($('lang').value==='hi-IN'?'en-IN':$('lang').value);
 var parts=(t.match(/[^.!?\u0964\n]+[.!?\u0964]*/g)||[t]).map(function(x){return x.trim()}).filter(Boolean),idx=0;
 function next(){if(tok!==spTok)return;if(idx>=parts.length){done();return}
  var u=new SpeechSynthesisUtterance(parts[idx++]),v=pickVoice(lang);
  if(v){u.voice=v;u.lang=v.lang}else u.lang=lang;
  u.rate=.93+Math.random()*.07;u.pitch=1+Math.random()*.08;
  u.onstart=function(){if(tok===spTok)setS('speaking')};
  u.onend=function(){setTimeout(next,170)};u.onerror=function(){if(tok===spTok)done()};
  ss.speak(u)}
 next()}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$('vsel').onchange=function(){chosen=this.value;try{localStorage.setItem('dora_v',chosen)}catch(e){}};
$('vtest').onclick=function(){busy=true;speak("Hi, I'm Dora. How are you doing today?")};
function done(){busy=false;if($('wk').checked&&recOn){setS('listening');cap.textContent='Say "Hey Dora…"'}else{setS('idle');cap.textContent='Tap the mic and speak, or type below.'}}

function instr(){return 'You are Dora, a warm, caring companion who talks like a real friend, never like a robot or a manual. Use natural spoken phrasing: contractions, short sentences, and a light touch of fillers such as acha, hmm or arre when it fits the user\'s language. Match their mood: gentle if they sound low, cheerful if they are excited. Reply in the same language and script the user used (Devanagari Hindi, Roman Hinglish, or English). Keep it to 1-3 short sentences because it is spoken aloud; no markdown, lists or emojis; use commas and full stops where a person would naturally pause. You cannot set reminders, browse the web, check live weather or take actions on devices; if asked, say so honestly and offer what you can do (chat, explain, draft text). Current local date and time: '+new Date().toString()+'.'}
async function ask(text){
 text=(text||'').trim();if(!text||busy)return;busy=true;
 add('u',text);var prior=hist.slice(-10).map(function(h){return{role:h.r==='u'?'user':'assistant',content:h.t}});
 while(prior.length&&prior[0].role!=='user')prior.shift();
 hist.push({r:'u',t:text});save();setS('thinking');cap.textContent='Thinking…';
 var el=add('a typing',''),reply=null,failed=false,emb=!!(window.claude&&window.claude.use);
 try{
  if(emb){
   if(!sample)sample=await window.claude.use('sample');
   if(!sample)throw{code:'unavailable'};
   var r=await sample(prior.concat([{role:'user',content:instr()+'\n\nUser said: '+text}]),{cache:false,modelTier:'quick',onText:function(o){el.classList.remove('typing');el.textContent=o.text;scroll()}});
   reply=(r&&r.text||'').trim()
  }else{
   var res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:prior.concat([{role:'user',content:text}])})});
   if(!res.ok)throw{code:res.status===429?'rate_limited':'http'};
   reply=((await res.json()).reply||'').trim()
  }
 }catch(e){failed=true;var c=e&&e.code;el.className='m a err';
  el.textContent=c==='not_granted'?'Permission was not granted, so no reply could be generated.':c==='rate_limited'?'Too many requests. Please try again in a moment.':c==='unavailable'?'The reply engine is unavailable in this view. Open the artifact on claude.ai while signed in.':emb?'Could not get a reply. Please try again.':'Could not reach the Dora server. Is the backend running?'}
 if(reply){el.className='m a';el.textContent=reply;hist.push({r:'a',t:reply});save();speak(reply)}
 else{if(!failed){el.className='m a err';el.textContent='The reply came back empty. Please try again.'}hist.pop();save();busy=false;done()}
}
$('send').onclick=function(){var v=inp.value;inp.value='';ask(v)};
inp.onkeydown=function(e){if(e.key==='Enter'){var v=inp.value;inp.value='';ask(v)}};
$('chips').onclick=function(e){if(e.target.tagName==='BUTTON')ask(e.target.textContent)};

var lastErr='';
function micMsg(c){var emb=!!(window.claude&&window.claude.use);return {'not-allowed':emb?'The microphone is blocked inside this embedded view, and a page cannot grant itself mic access. Run the standalone Dora (see README) in Chrome or Edge to use voice.':'Microphone permission was denied. Click the lock or mic icon in the address bar, allow the microphone, then try again.','service-not-allowed':'The browser blocked the speech service.','audio-capture':'No microphone was found. Connect one and try again.','network':'Speech recognition needs an internet connection. Please check your network.','language-not-supported':'This language is not supported by the browser. Change the voice language in Settings.','no-speech':'I did not hear anything. Try speaking a little closer to the mic.'}[c]||('Mic error: '+c)}
async function startRec(){
 if(!SR||recOn)return;
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
  try{var ms=await navigator.mediaDevices.getUserMedia({audio:true});ms.getTracks().forEach(function(t){t.stop()})}
  catch(e){var nm=e&&e.name;cap.textContent=nm==='NotFoundError'?micMsg('audio-capture'):micMsg('not-allowed')+' ('+(nm||'error')+')';cap.style.color='#ffb4b4';$('wk').checked=false;return}}
 cap.style.color='';lastErr='';
 rec=new SR();rec.lang=$('lang').value;rec.interimResults=true;rec.continuous=$('wk').checked;
 var wake=$('wk').checked;
 rec.onresult=function(e){if(busy)return;cap.style.color='';var t='',fin=false;
  for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}
  if(!wake){cap.textContent=t;if(fin){recOn=false;ask(t)}return}
  if(fin){var m=t.match(/(?:dora|\u0921\u094b\u0930\u093e|\u0926\u094b\u0930\u093e)[,\s]*(.*)/i);
   if(m){var c=m[1].trim();if(c)ask(c);else{busy=true;speak("Yes, I'm listening")}}}};
 rec.onerror=function(e){if(wake&&(e.error==='no-speech'||e.error==='aborted'))return;lastErr=e.error;cap.textContent=micMsg(e.error);cap.style.color='#ffb4b4';
  if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){recOn=false;$('wk').checked=false}};
 rec.onend=function(){if(wake&&recOn&&$('wk').checked){try{rec.start()}catch(x){}}else{recOn=false;if(!busy){setS('idle');if(!lastErr)cap.textContent='Tap the mic and speak, or type below.'}}};
 try{rec.start();recOn=true;if(!busy){setS('listening');cap.textContent=wake?'Say "Hey Dora…"':'Listening…'}}catch(x){recOn=false;cap.textContent='Could not start the mic: '+(x&&x.message||x)}}
function stopRec(){recOn=false;try{rec&&rec.stop()}catch(x){}if(!busy){setS('idle');cap.textContent='Tap the mic and speak, or type below.'}}
$('mic').onclick=function(){spTok++;if(window.speechSynthesis)speechSynthesis.cancel();if(busy&&st==='speaking'){busy=false}if(recOn)stopRec();else if(!busy)startRec()};
$('wk').onchange=function(){stopRec();if(this.checked)setTimeout(startRec,150)};
$('lang').onchange=function(){if(recOn){var w=$('wk').checked;stopRec();setTimeout(startRec,200)}};

$('rep').onclick=function(){$('file').click()};
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){img.style.visibility='visible';img.src=r.result};r.readAsDataURL(f)};
$('rem').onclick=function(){img.style.visibility='hidden'};
$('rst').onclick=function(){img.style.visibility='visible';img.src=orig};
$('clr').onclick=function(){hist=[];save();log.innerHTML='';add('sys','Chat cleared.')};

var cv=$('cv'),cx=cv.getContext('2d'),W=0,N=72,amp=[],parts=[],i;
for(i=0;i<N;i++)amp.push(0);
for(i=0;i<40;i++)parts.push({a:Math.random()*6.28,r:.3+Math.random()*.18,s:(Math.random()-.5)*.004,z:Math.random()*1.6+.4});
function size(){var d=window.devicePixelRatio||1;W=cv.clientWidth;cv.width=cv.height=W*d;cx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',size);size();
function frame(t){var c=W/2,tg={idle:.05,listening:.3,thinking:.15,speaking:.75}[st];cx.clearRect(0,0,W,W);
for(i=0;i<N;i++){var a=i/N*6.283,w=Math.sin(t/180+i*.55)*.5+.5,w2=Math.sin(t/330+i*1.3)*.5+.5,g=tg*(.25+.75*(w*.6+w2*.4));
if(st==='thinking')g=tg*(.3+.7*((Math.sin(t/200-a*3)+1)/2));
amp[i]+=(g-amp[i])*.15;var r0=.31*W,r1=r0+(.02+amp[i]*.13)*W,gr=cx.createLinearGradient(c+Math.cos(a)*r0,c+Math.sin(a)*r0,c+Math.cos(a)*r1,c+Math.sin(a)*r1);
gr.addColorStop(0,'rgba(67,224,255,'+(.4+amp[i]*.6)+')');gr.addColorStop(1,'rgba(155,107,255,'+(.4+amp[i]*.6)+')');
cx.strokeStyle=gr;cx.lineWidth=Math.max(2,W*.007);cx.lineCap='round';cx.beginPath();cx.moveTo(c+Math.cos(a)*r0,c+Math.sin(a)*r0);cx.lineTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);cx.stroke()}
cx.fillStyle='rgba(150,230,255,.7)';
parts.forEach(function(p){p.a+=p.s*(st==='idle'?1:3);cx.beginPath();cx.arc(c+Math.cos(p.a)*p.r*W,c+Math.sin(p.a)*p.r*W,p.z,0,6.283);cx.fill()});
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
var dip=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dip=e;$('inst').hidden=false});
$('inst').onclick=function(){if(!dip)return;dip.prompt();dip.userChoice.then(function(){dip=null;$('inst').hidden=true})};
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
